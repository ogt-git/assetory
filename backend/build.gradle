plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.project'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-mail'

	// 운영 지표 — 관리 포트에서 health · prometheus만 노출 (FR-OP-01, NFR-SE-08). 버전은 Boot BOM 관리
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

	// CODEF API
	implementation 'io.codef.api:easycodef-java:1.0.6'

	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// API 문서 · Swagger UI — local에서 SWAGGER_ENABLED=true일 때만 노출
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'

	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:mysql'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	// 한투 실호출 검증(@Tag("kis-live"))은 기본 테스트에서 제외 — kisLiveTest로 따로 실행
	useJUnitPlatform {
		excludeTags 'kis-live'
	}
}

// 한투 실호출 검증 — KIS_APP_KEY · KIS_APP_SECRET 환경변수가 있을 때만 실행된다 (docs/ops/kis-verification.md)
tasks.register('kisLiveTest', Test) {
	description = '한투(KIS) Open API 실호출 검증'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'kis-live'
	}
	testLogging {
		showStandardStreams = true
	}
	outputs.upToDateWhen { false }
}
