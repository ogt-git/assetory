# 테스트 전용 — DB·Redis는 Testcontainers(@ServiceConnection)가 덮어쓴다. 아래 키는 테스트용 더미 값이며 실제 키가 아니다
spring:
  datasource:
    url: jdbc:mysql://overridden-by-testcontainers/test
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: create-drop
  data:
    redis:
      host: localhost

assetory:
  crypto:
    aes-key: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
  ecos:
    # 테스트에서 실제 ECOS를 부르지 않는다 — 실행 환경에 ECOS_API_KEY가 있어도 비운다(키가 없으면 호출 전에 실패)
    api-key: ""
  evidence:
    # 뉴스 보관 기한 삭제 스케줄 끔 — 테스트는 서비스를 직접 부른다
    news-retention:
      enabled: false
  analysis:
    # PENDING 근거 재수집 스케줄 끔 — 테스트는 EvidenceRetryService를 직접 부른다
    retry:
      enabled: false

jwt:
  secret: test-only-jwt-secret-not-for-real-use-0123456789

cors:
  allowed-origins: http://localhost:5173

app:
  cookie:
    secure: false
    same-site: Lax

# CODEF 동기화 재시도 대기 — 테스트에서는 기다리지 않음
assetory.codef.sync.retry-backoff-ms: 0
