# fake 프로필 — 로컬 화면 확인 전용(테스트 리소스, 운영 jar에 포함되지 않음). 실행: ./gradlew bootTestRun
# DB · Redis는 기동할 때마다 새 Testcontainers(@ServiceConnection)가 덮어쓴다. 아래 키는 모두 fake 전용 더미 값이며 실제 키가 아니다
spring:
  datasource:
    url: jdbc:mysql://overridden-by-testcontainers/fake
    username: fake
    password: fake
  jpa:
    hibernate:
      # 매번 새 컨테이너라 시작할 때 만든다
      ddl-auto: create
  data:
    redis:
      host: localhost

assetory:
  crypto:
    aes-key: ZmFrZS1vbmx5LWFlcy1rZXktbm90LWZvci1yZWFsLTE=
  mail:
    # 실제 발송은 하지 않는다(FakeInfraConfig가 로그 출력 구현을 우선 주입). SMTP 빈 생성 검사만 통과시키는 더미 주소
    from: no-reply@assetory.test
  kis:
    # base-url은 FakeKisConfig가 가짜 한투 서버 주소로 바꾼다
    app-key: fake-only-app-key
    app-secret: fake-only-app-secret
    call-interval-ms: 0
  sync:
    batch:
      # 일일 배치(16:00) 끔 — 기록은 데모 시드가 넣는다
      enabled: false

jwt:
  secret: fake-only-jwt-secret-not-for-real-use-0123456789

codef:
  client-id: fake-only-client-id
  client-secret: fake-only-client-secret

cors:
  allowed-origins: http://localhost:5173

app:
  cookie:
    secure: false
    same-site: Lax

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
