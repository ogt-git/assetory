spring:
  application:
    name: assetory

  profiles:
    default: local

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # 프로필별로 지정 (local: update, prod: validate)
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# 암호화 키 — Base64 인코딩된 32바이트. 없거나 형식이 틀리면 기동 실패 (AesEncryptionUtil)
assetory:
  crypto:
    aes-key: ${ASSETORY_AES_KEY:}

# JWT — 서명 키는 32바이트 이상. 만료는 FR-AU-02 (AT 30분, RT 14일)
jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_EXPIRATION_MS:1800000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:1209600000}

# CORS — 쉼표로 구분한 허용 origin
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

# Refresh Token 쿠키 — 프로필별로 덮어씀 (local: Secure false, prod: SameSite None)
app:
  cookie:
    secure: true
    same-site: Lax
