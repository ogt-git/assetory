spring:
  application:
    name: assetory

  profiles:
    default: local

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 초기 데이터(data.sql) — 기동할 때마다 실행되며 멱등하게 작성한다
  sql:
    init:
      mode: always
      # 한글 시드(기관명) — Java 17은 Windows 기본 문자셋이 cp949라 명시한다
      encoding: UTF-8

  jpa:
    open-in-view: false
    # data.sql(초기 데이터)은 Hibernate가 테이블을 만든 뒤에 실행
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: none   # 프로필별로 지정 (local: update, prod: validate)
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # 외부 API 타임아웃 10초 (NFR-PF-05)
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

# 암호화 키 — Base64 인코딩된 32바이트. 없거나 형식이 틀리면 기동 실패 (AesEncryptionUtil)
assetory:
  crypto:
    aes-key: ${ASSETORY_AES_KEY:}
  # 인증 메일 발신 주소 — 없으면 MAIL_USERNAME 사용. local에서 log-only: true면 실제 발송 대신 로그 출력
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    log-only: false
  # 한투(KIS) Open API — 시세 조회 전용 (FR-MK-01). 키 · 시크릿은 환경변수로만. 비어 있어도 기동되고 호출 시 실패한다
  kis:
    # 실전 도메인 기본(호출 한도가 높음). 모의: https://openapivts.koreainvestment.com:29443 + KIS_CALL_INTERVAL_MS=500
    base-url: ${KIS_BASE_URL:https://openapi.koreainvestment.com:9443}
    app-key: ${KIS_APP_KEY:}
    app-secret: ${KIS_APP_SECRET:}
    # 호출 간 최소 간격 — 공식 예제 기준 실전 50ms(약 20건/초)
    call-interval-ms: ${KIS_CALL_INTERVAL_MS:50}
    # 외부 API 타임아웃 10초 (NFR-PF-05)
    connect-timeout: 10s
    read-timeout: 10s
    # 토큰(유효 1일)을 만료 이 시간 전에 새로 받는다 — 배치 도중 만료 방지. 발급은 하루 1회 수준으로 유지된다
    token-refresh-margin: ${KIS_TOKEN_REFRESH_MARGIN:10m}
    # EGW00201(초당 거래건수 초과)만 재시도
    rate-limit:
      max-retries: ${KIS_RATE_LIMIT_MAX_RETRIES:2}
      backoff-ms: ${KIS_RATE_LIMIT_BACKOFF_MS:1000}
  # 시장 데이터 수집 (FR-MK-01 · 06)
  market:
    # 거래일 판정 기준 종목 — 최신 거래일자가 오늘이면 거래일 (01 §14 #23 (c)안)
    reference-ticker: ${ASSETORY_MARKET_REFERENCE_TICKER:005930}
    # 이 시각 전에는 오늘 행을 종가로 저장하지 않는다 — 15:30 종가 단일가 + 여유 10분 (장중에는 종가 칸에 현재가, V4)
    close-guard-time: ${ASSETORY_MARKET_CLOSE_GUARD_TIME:15:40}
    # 시세 호출 실패가 연속 이 횟수면 남은 종목 호출을 멈춘다 (서킷 브레이커 대신)
    max-consecutive-failures: ${ASSETORY_MARKET_MAX_CONSECUTIVE_FAILURES:5}
    # 장 마감 지연일(수능일 — 정규장 1시간 순연, 16:30 마감). 콤마 구분. 이 날은 아래 지연 가드를 쓰고 16:00 배치는 건너뛴다
    # TODO(01-§14 신규 제안): 2027학년도 수능 2026-11-19 확정, 그날 증시 매매시간은 KRX 공지로 확인 필요
    late-close-dates: ${ASSETORY_MARKET_LATE_CLOSE_DATES:2026-11-19}
    # 장 마감 지연일의 가드 — 16:30 마감 + 여유 10분
    late-close-guard-time: ${ASSETORY_MARKET_LATE_CLOSE_GUARD_TIME:16:40}
  # 일일 자산 기록 배치(거래일 판정 → CODEF → 시세 → 스냅샷) — 기본 비활성. cron은 영업일 16:00 (04 §2)
  sync:
    batch:
      enabled: ${ASSETORY_SYNC_BATCH_ENABLED:false}
      cron: ${ASSETORY_SYNC_BATCH_CRON:0 0 16 * * MON-FRI}

# JWT — 서명 키는 32바이트 이상. 만료는 FR-AU-02 (AT 30분, RT 14일)
jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_EXPIRATION_MS:1800000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:1209600000}

# CODEF API — service-type 0: 정식, 1: 데모 (Q-5: 데모로 진행)
codef:
  client-id: ${CODEF_CLIENT_ID:}
  client-secret: ${CODEF_CLIENT_SECRET:}
  public-key: ${CODEF_PUBLIC_KEY:}
  service-type: ${CODEF_SERVICE_TYPE:1}

# CORS — 쉼표로 구분한 허용 origin
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

# API 문서(/v3/api-docs) · Swagger UI(/swagger-ui/index.html) — 기본 비활성, local에서만 SWAGGER_ENABLED=true로 켠다 (prod는 강제 비활성)
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

# 운영 지표 (FR-OP-01, NFR-SE-08) — 관리 포트를 API 포트와 분리하고 health · prometheus만 노출한다
# 보호는 포트 분리 + 네트워크(운영 보안그룹에서 관리 포트 미개방)로 한다. 접근 방법은 docs/ops/monitoring.md
management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8082}
  endpoints:
    web:
      # /actuator 링크 목록도 열지 않는다
      discovery:
        enabled: false
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: never
  # 메일(SMTP)은 가입 인증 · 비밀번호 재설정에만 쓰고 실패 시 요청 단위로 처리한다 → SMTP 상태로 앱 전체를 DOWN으로 판정하지 않는다
  health:
    mail:
      enabled: false
  metrics:
    # 태그에 userId · 종목코드 · 원문 URL처럼 값이 계속 늘어나는 것을 넣지 않는다
    tags:
      application: ${spring.application.name}
    distribution:
      # 개선 전후 비교용 — HTTP 응답시간(NFR-PF-01 p95 500ms 판정) · repository 메서드 실행 시간
      percentiles-histogram:
        http.server.requests: true
        spring.data.repository.invocations: true
      slo:
        http.server.requests: ${MANAGEMENT_HTTP_SLO:100ms,300ms,500ms,1s}

# Refresh Token 쿠키 — 프로필별로 덮어씀 (local: Secure false, prod: SameSite None)
app:
  cookie:
    secure: true
    same-site: Lax
