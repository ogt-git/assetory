spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

# 프론트·API 도메인이 달라 cross-site 쿠키 전송이 필요 (D-4)
app:
  cookie:
    secure: true
    same-site: None

# 운영에서는 SWAGGER_ENABLED 값과 관계없이 API 문서를 노출하지 않는다
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
